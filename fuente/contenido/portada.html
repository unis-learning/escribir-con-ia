<style>
  /* =========================================================
     PORTADA · UNIS Virtual (UNIS-001 D5: la guinda de los ejemplos del cliente)
     Como «Ejemplo 01»: a la izquierda, sobre la guinda, el logo, el eyebrow con su filete amarillo,
     el título en dos líneas tal como se escribe (la primera blanca, la segunda amarilla), un filete,
     el subtítulo y el botón amarillo «Ver el contenido». Sin frase destacada (ajuste del arquitecto
     en la muestra, 2026-11-16). A la derecha, la foto a todo el alto, sin marco, en una de dos
     vistas: «silueteada» (la persona recortada delante de las formas, como en los ejemplos) o
     «foto» (la foto suelta, sin recorte; es la de la semilla, porque solo pide un archivo). Se cambia de una a otra quitando o
     poniendo la clase un-portada--silueta en la sección (familia gráfica, INSTITUCION §1.4 y §2).
     Foto: va en assets/img/curso/portada-persona.webp (WebP de 1600 px con
     scripts/optimizar-figuras.py; el original, en insumos/). Nítida y de buena resolución, con la
     persona de frente o de tres cuartos; se recorta alrededor de la persona (cuadrada va bien) para
     que llegue con el mayor tamaño posible. Mientras no llegue, un hueco data-ova-hueco ocupa la
     caja; con la foto, el hueco se cambia por el <img> con su alt.
     Para la vista silueteada llega además portada-persona-silueta.webp (la misma foto con la persona
     recortada, sin fondo, del mismo tamaño): se pone la clase un-portada--silueta en la sección, se
     quita el comentario del bloque .un-portada__marco--silueta y se centran las formas del patrón en
     la persona. Cómo se saca la silueta: INSTITUCION §2.
     La fuente y la licencia de la foto de cada curso se anotan en la guía (INSTITUCION §2).
     El CSS de portada viaja por curso, como en las otras instituciones de la RED.
     ========================================================= */
  .un-portada{
    position:relative; overflow:hidden; isolation:isolate;
    min-height:100vh; min-height:100dvh;
    display:grid; grid-template-columns:minmax(0, 46fr) minmax(0, 54fr); align-items:center;
    color:#fff;
    background:
      radial-gradient(circle at 34% -18%, rgba(255,255,255,.045) 0 31vw, transparent calc(31vw + 1px)),
      radial-gradient(circle at -6% 104%, rgba(0,0,0,.20) 0 24vw, transparent calc(24vw + 1px)),
      linear-gradient(120deg, var(--c-deep) 0%, var(--c-guinda) 100%);
    background-color:var(--c-deep);   /* el color de fondo que leen las medidas de contraste */
  }
  .un-portada__texto{
    position:relative; z-index:2;
    padding:clamp(24px, 5vh, 72px) 12px clamp(24px, 5vh, 72px) clamp(28px, 4.7vw, 80px);
  }
  .un-portada__logo img{ height:clamp(58px, 10vh, 92px); width:auto; display:block; margin-bottom:clamp(28px, 8vh, 84px); }
  .un-portada__eyebrow{
    display:flex; align-items:center; gap:18px;
    margin-bottom:clamp(14px, 2.6vh, 24px);
    font-weight:500; font-size:clamp(.85rem, 1.3vw, 1.2rem); letter-spacing:.24em; text-transform:uppercase;
    color:var(--c-amarillo);
  }
  .un-portada__eyebrow::before{ content:''; width:44px; height:3px; border-radius:2px; background:var(--c-amarillo); }
  .un-portada__title{
    margin:0; width:fit-content; max-width:100%; padding-bottom:clamp(16px, 3vh, 28px);
    border-bottom:1px solid color-mix(in srgb, var(--c-amarillo) 55%, transparent);
    color:#fff; font-weight:700; letter-spacing:-.01em;
    font-size:min(clamp(2.3rem, 4vw, 4.2rem), 9.6vh); line-height:1.1;
  }
  .un-portada__destacado{ display:block; color:var(--c-amarillo); }
  .un-portada__junto{ display:block; white-space:nowrap; }   /* «sin perder» en su propia línea: el título va en tres líneas en toda pantalla y el filete mide lo que la línea más larga */
  .un-portada__sub{
    margin:clamp(18px, 3.4vh, 34px) 0 clamp(26px, 5.4vh, 52px); max-width:22em;
    font-size:clamp(1.15rem, 2vw, 1.9rem); line-height:1.3; color:#fff;
    text-wrap:balance;   /* dos líneas parejas, sin una palabra sola abajo */
  }
  .un-portada__cta{
    display:inline-flex; align-items:center; gap:14px;
    padding:clamp(14px, 2.2vh, 20px) clamp(28px, 2.6vw, 40px); border-radius:8px;
    background:var(--c-amarillo); color:var(--c-deep); text-decoration:none;
    font-weight:700; font-size:clamp(1rem, 1.4vw, 1.25rem);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .un-portada__cta:hover, .un-portada__cta:focus-visible{
    color:var(--c-deep); transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,.28);
  }
  .un-portada__cta:focus-visible{ outline:3px solid #fff; outline-offset:3px; }

  /* La foto y sus formas. La caja (.un-portada__visual) es la mitad derecha de la portada, a todo
     el alto. Dos vistas con el mismo HTML:
     · «silueteada» (.un-portada--silueta): sobre la foto va el patrón de formas de «Ejemplo 01» y,
       encima de todo, la misma foto con la persona recortada, sin fondo
       (portada-persona-silueta.webp, del mismo tamaño y encuadre). La persona queda delante.
     · «foto» (.un-portada sola): la foto suelta, sin recorte; las formas solo dibujan su borde
       izquierdo y dos esquinas, sin tocar a la persona.
     La foto se pone «a cubrir» en un lienzo (.un-portada__lienzo) que es su rectángulo exacto; las
     formas del patrón viven dentro de ese lienzo y se miden en --i (una centésima del alto de la
     foto), así que siguen a la persona en cualquier pantalla. Las formas del borde se miden desde
     la caja, en --u (una centésima de su alto). Por foto se ajustan: --ratio (ancho ÷ alto de la
     foto), --px y --py (qué parte se ve cuando sobra foto: 0 = izquierda o arriba, 1 = derecha o
     abajo) y la posición de las formas del patrón, que se centran en la persona. */
  .un-portada__visual{ --u:1vh; position:relative; z-index:1; align-self:stretch; min-height:100%; }
  .un-portada__visual > *{ position:absolute; display:block; }
  .un-portada__marco{ inset:0; overflow:hidden; container-type:size; }
  .un-portada__marco:not(.un-portada__marco--silueta){ background:color-mix(in srgb, #fff 10%, var(--c-deep)); }
  .un-portada__marco > *, .un-portada__lienzo > *{ position:absolute; display:block; }
  .un-portada__lienzo{
    --ratio:1; --px:0; --py:0;   /* --py:0: la foto se ancla arriba para no cortar el cabello en celulares bajos */
    --w:max(100cqw, calc(100cqh * var(--ratio))); --h:calc(var(--w) / var(--ratio)); --i:calc(var(--h) / 100);
    width:var(--w); height:var(--h);
    /* la caja nunca esconde más del 12 % izquierdo de la foto */
    left:max(calc((100cqw - var(--w)) * var(--px)), calc(var(--w) * -.12)); top:calc((100cqh - var(--h)) * var(--py));
  }
  .un-portada--silueta .un-portada__lienzo{ --px:.3; }   /* .3 y no el .5 de la semilla: la persona va a la izquierda del centro de la foto */
  .un-portada__lienzo img{ inset:0; width:100%; height:100%; object-fit:cover; }
  /* el hueco de la foto, mientras no llegue: en la caja, en blanco */
  .un-portada__marco > [data-ova-hueco]{ inset:0; display:grid; place-items:center; padding:14% 12% 14% 26%; text-align:center; font-size:.92rem; color:#fff; }
  .un-portada__marco--silueta, .un-portada__patron{ display:none; }
  .un-portada__patron, .un-portada__asoma, .un-portada__arco, .un-portada__aro, .un-portada__anillo{ border-radius:50%; aspect-ratio:1; }
  .un-portada__franja{ border-radius:0; aspect-ratio:auto; }

  /* el borde izquierdo de la foto: dos arcos guinda, en las dos vistas */
  .un-portada__arco--alto{ width:calc(var(--u) * 100); left:calc(var(--u) * -88); top:calc(var(--u) * -20); background:var(--c-guinda); }
  .un-portada__arco--bajo{ width:calc(var(--u) * 90); left:calc(var(--u) * -78); top:calc(var(--u) * 48); background:var(--c-deep); }
  /* vista foto: un disco amarillo y uno rojo asoman entre los arcos */
  .un-portada__asoma--amarillo{ width:calc(var(--u) * 40); left:calc(var(--u) * -18); top:calc(var(--u) * -10); background:var(--c-amarillo); }
  .un-portada__asoma--rojo{ width:calc(var(--u) * 30); left:calc(var(--u) * -18); top:calc(var(--u) * 51); background:var(--c-rojo); }
  .un-portada__aro{ width:calc(var(--u) * 14); left:calc(var(--u) * -3); top:calc(var(--u) * 60); border:calc(var(--u) * 1.2) solid var(--c-deep); }
  .un-portada__anillo{ width:calc(var(--u) * 12); right:calc(var(--u) * 3); top:calc(var(--u) * 6); border:calc(var(--u) * 1.4) solid var(--c-amarillo); }
  .un-portada__bloque{ width:calc(var(--u) * 5); height:calc(var(--u) * 30); right:0; bottom:calc(var(--u) * 18); background:var(--c-rojo); }
  .un-portada__banda{ display:none; }
  /* vista foto: aire entre el arco bajo y la persona; el bloque no va si la caja es más angosta que la foto */
  .un-portada:not(.un-portada--silueta) .un-portada__arco--bajo{ left:calc(var(--u) * -80); }
  @container (max-aspect-ratio: 95/100){ .un-portada:not(.un-portada--silueta) .un-portada__bloque{ display:none; } }

  /* Vista silueteada: la persona delante y, detrás, el patrón de «Ejemplo 01», del vinotinto al
     amarillo: pegados al borde guinda, un círculo rojo grande y otro vinotinto arriba; sobre ellos,
     la franja amarilla que baja del borde superior y dos círculos amarillos (uno claro, uno vivo)
     detrás de la cabeza y los hombros; un aro guinda entre el borde y el rojo, un anillo amarillo
     arriba a la derecha y dos bloques en el borde derecho. Los arcos guinda pasan por detrás de la
     persona. El patrón se centra en la persona: aquí su cabeza está en el 44 % del ancho de la foto, así
     que la franja y los dos círculos amarillos van 8 unidades a la izquierda de donde los trae la semilla. */
  .un-portada--silueta :is(.un-portada__marco--silueta, .un-portada__patron, .un-portada__banda){ display:block; }
  .un-portada--silueta .un-portada__asoma{ display:none; }
  .un-portada__rojo{ width:calc(var(--i) * 66); left:calc(var(--i) * -13); top:calc(var(--i) * 19); background:var(--c-rojo); }
  .un-portada__vino{ width:calc(var(--i) * 48); left:calc(var(--i) * -8); top:calc(var(--i) * -16); background:color-mix(in srgb, var(--c-guinda) 68%, var(--c-rojo)); }
  .un-portada__franja{ width:calc(var(--i) * 24); height:calc(var(--i) * 40); left:calc(var(--i) * 16); top:0; background:var(--c-amarillo); }
  .un-portada__halo{ width:calc(var(--i) * 58); left:calc(var(--i) * 21); top:calc(var(--i) * 9); background:color-mix(in srgb, var(--c-amarillo) 62%, #fff); }
  .un-portada__disco{ width:calc(var(--i) * 48); left:calc(var(--i) * 24); top:calc(var(--i) * 28); background:var(--c-amarillo); }
  .un-portada--silueta .un-portada__aro{ width:calc(var(--u) * 15); left:calc(var(--u) * 1.5); top:calc(var(--u) * 45); }
  .un-portada--silueta .un-portada__bloque{ width:calc(var(--u) * 6); height:calc(var(--u) * 30); bottom:calc(var(--u) * 20); }
  .un-portada--silueta .un-portada__banda{ width:calc(var(--u) * 6); height:calc(var(--u) * 20); right:calc(var(--u) * 6); bottom:calc(var(--u) * 30); background:color-mix(in srgb, var(--c-amarillo) 62%, #fff); }

  /* en una pantalla casi cuadrada la caja de la foto se estrecha: el anillo y los bloques del borde
     derecho y el aro no van, y la silueta se corre un poco para que no se corte por la izquierda */
  @media (min-width: 901px) and (min-aspect-ratio: 1001/1000) and (max-aspect-ratio: 155/100){
    .un-portada__marco > :is(.un-portada__anillo, .un-portada__bloque, .un-portada__banda){ display:none; }
    .un-portada--silueta .un-portada__lienzo{ --px:.3; }
    .un-portada--silueta .un-portada__aro{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){ .un-portada__cta{ transition:none; } }

  /* Celular, tableta y toda pantalla más alta que ancha: la foto arriba, a todo el ancho, y el
     texto debajo. El alto de la foto es lo que deja el texto, para que «Ver el contenido» entre en
     la primera vista. */
  @media (max-width: 900px), (max-aspect-ratio: 1/1){
    .un-portada{ grid-template-columns:minmax(0, 1fr); align-content:start; }
    .un-portada__visual{
      --alto:clamp(150px, calc(100svh - 400px), 50svh);   /* 400 y no el 372 de la semilla: el título va en tres líneas y el subtítulo en dos */ --u:calc(var(--alto) / 100);
      order:-1; min-height:0; height:var(--alto);
    }
    /* el borde inferior de la foto, en curva */
    .un-portada__marco{ clip-path:ellipse(130% 100% at 60% 0); }
    .un-portada__texto{ padding:22px 24px 28px; }
    .un-portada__logo img{ height:42px; margin-bottom:18px; }
    .un-portada__eyebrow{ margin-bottom:10px; gap:14px; }
    .un-portada__eyebrow::before{ width:32px; }
    .un-portada__title{ font-size:clamp(1.9rem, 8.4vw, 2.8rem); padding-bottom:12px; }
    .un-portada__sub{ margin:14px 0 20px; font-size:clamp(1.1rem, 4.6vw, 1.4rem); }
  }
  /* tableta en vertical: el texto un paso más grande y la foto un poco más alta */
  @media (min-width: 700px) and (max-aspect-ratio: 1/1){
    .un-portada__visual{ --alto:clamp(150px, calc(100svh - 512px), 56svh); }
    .un-portada__texto{ padding:32px 48px 40px; }
    .un-portada__logo img{ height:56px; margin-bottom:24px; }
    .un-portada__title{ font-size:3.4rem; }
    .un-portada__sub{ font-size:1.6rem; }
  }
  /* celular acostado: lado a lado, como en escritorio, con el texto compacto */
  @media (max-width: 900px) and (min-aspect-ratio: 16/10) and (max-height: 480px){
    .un-portada{ grid-template-columns:minmax(0, 46fr) minmax(0, 54fr); align-content:normal; }
    .un-portada__visual{ --u:1vh; order:0; height:auto; min-height:100%; }
    .un-portada__marco{ clip-path:none; }
    .un-portada__texto{ padding:14px 12px 14px 24px; }
    .un-portada__logo img{ height:34px; margin-bottom:12px; }
    .un-portada__title{ font-size:min(1.9rem, 3.7vw); padding-bottom:8px; }
    .un-portada__sub{ margin:10px 0 14px; font-size:1rem; }
    .un-portada__cta{ padding:10px 20px; }
  }
</style>

<section class="un-portada un-portada--silueta">
  <div class="un-portada__texto">
    <div class="un-portada__logo">
      <img src="assets/img/logos/un-logo-blanco.svg" alt="UNIS Virtual" />
    </div>

    <div class="un-portada__eyebrow">Unidad 1</div>

    <!-- Título de la unidad, literal del DI y tal como se escribe, en dos líneas: la primera en blanco;
         la segunda, en amarillo, dentro de <span class="un-portada__destacado"> (INSTITUCION §2) -->
    <!-- DISEÑO: el título no cabe en dos líneas; va en tres, «Escribir con IA / sin perder / la propia voz»
         (aprobado por el arquitecto, 2026-11-17). .un-portada__junto mantiene juntas «sin perder»; no se usa
         el espacio de no separación porque Gotham lo pinta mal y la palabra siguiente desaparece. -->
    <h1 class="un-portada__title" lang="es">Escribir con IA <span class="un-portada__junto">sin perder</span> <span class="un-portada__destacado">la propia voz</span></h1>

    <!-- DESVIACIÓN DEL DI: el Word dice «Asignatura - Competencias digitales para el posgrado»; la portada
         muestra solo el nombre del curso, como en las otras instituciones de la RED (aprobado, 2026-11-17). -->
    <p class="un-portada__sub">Competencias digitales para el posgrado</p>
    <!-- DESVIACIÓN DEL DI: el Word trae «Frase destacada: La IA puede escribir por usted; solo usted puede
         firmar». La portada de UNIS no lleva frase destacada (INSTITUCION §2; aprobado, 2026-11-17); la
         frase va literal en la Conclusión. -->

    <a class="un-portada__cta" href="temario.html">
      Ver el contenido
      <iconify-icon icon="mdi:arrow-right"></iconify-icon>
    </a>
  </div>

  <div class="un-portada__visual">
    <div class="un-portada__marco">
      <div class="un-portada__lienzo">
        <!-- Imagen-01 del DI: recorte cuadrado alrededor de la persona (insumos/imagenes/portada-persona-recorte.jpg) -->
        <img src="assets/img/curso/portada-persona.webp" alt="Una mujer de lentes y cabello corto y rizado escribe en un portátil, en una oficina con luz de ventana." />
        <span class="un-portada__patron un-portada__rojo" aria-hidden="true"></span>
        <span class="un-portada__patron un-portada__vino" aria-hidden="true"></span>
        <span class="un-portada__patron un-portada__franja" aria-hidden="true"></span>
        <span class="un-portada__patron un-portada__halo" aria-hidden="true"></span>
        <span class="un-portada__patron un-portada__disco" aria-hidden="true"></span>
      </div>
      <span class="un-portada__asoma un-portada__asoma--amarillo" aria-hidden="true"></span>
      <span class="un-portada__asoma un-portada__asoma--rojo" aria-hidden="true"></span>
      <span class="un-portada__anillo" aria-hidden="true"></span>
      <span class="un-portada__banda" aria-hidden="true"></span>
      <span class="un-portada__bloque" aria-hidden="true"></span>
    </div>
    <span class="un-portada__arco un-portada__arco--alto" aria-hidden="true"></span>
    <span class="un-portada__arco un-portada__arco--bajo" aria-hidden="true"></span>
    <span class="un-portada__aro" aria-hidden="true"></span>
    <!-- Vista silueteada (la que prefiere el cliente, 2026-11-18): la misma foto con la persona recortada,
         sin fondo (insumos/imagenes/portada-persona-silueta.png), delante de las formas. -->
    <div class="un-portada__marco un-portada__marco--silueta" aria-hidden="true">
      <div class="un-portada__lienzo">
        <img src="assets/img/curso/portada-persona-silueta.webp" alt="" />
      </div>
    </div>
  </div>
</section>
